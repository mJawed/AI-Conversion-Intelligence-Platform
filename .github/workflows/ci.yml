name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://growth:growth@localhost:5432/growth
      JWT_SECRET: ci-only-secret-change-me
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:validate --workspace @ai-growth/api
      - run: npm run db:generate --workspace @ai-growth/api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
